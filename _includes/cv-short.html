    <h1>ABBREVIATED CURRICULUM VITAE</h1>
    <p>Alejandro Guerrero-López · Updated {{ site.time | date: "%d %B %Y" }}</p>
    <h2>PART A. PERSONAL AND PROFESSIONAL INFORMATION</h2>
    <p><strong>Name:</strong> {{ site.author.name }}<br>
      <strong>Institution:</strong> Institute of Medical Microbiology, University of Zurich, Switzerland<br>
      <strong>Position:</strong> Marie Skłodowska-Curie Postdoctoral Fellow (since July 2026)<br>
      <strong>Email:</strong> <a href="mailto:{{ site.author.email }}">{{ site.author.email }}</a><br>

      <strong>Full CV:</strong> <a href="{{ '/cv/' | absolute_url }}">{{ '/cv/' | absolute_url }}</a></p>
    <h3>A.1. Academic qualifications</h3>
    <p>2023 — PhD in Bayesian Machine Learning applied to Personalised Medicine, Universidad Carlos III de Madrid (UC3M). Thesis: Clinical microbiology with multi-view deep probabilistic models.<br>
      2020 — MSc in Information Health Engineering, UC3M.<br>
      2019 — BSc in Telematic Engineering, Universitat de les Illes Balears.</p>
    <h3>A.2. Research and academic appointments</h3>
    <p>July 2025–present — Postdoctoral researcher, University of Zurich; MSCA Fellow since July 2026, in Prof. Adrian Egli's group.<br>
      2024–2025 — Visiting professor in Data Science, UC3M.<br>
      2023–2024 — Postdoctoral researcher, Bioengineering and Optoelectronics Group, Universidad Politécnica de Madrid.<br>
      2020–2023 — Doctoral researcher, UC3M and Gregorio Marañón Health Research Institute.<br>
      2019–2020 — Research assistant, UC3M; 2017–2018 — Research assistant, Universitat de les Illes Balears.</p>
    <h2>PART B. CURRICULUM SUMMARY</h2>
    <p>My research focuses on applied machine learning for healthcare, with particular emphasis on clinical microbiology, Bayesian modelling and multimodal biomedical data. I develop methods for antimicrobial resistance prediction, bacterial identification and strain typing using routine MALDI-TOF mass spectra, and work with clinical collaborators to translate these methods into usable research tools.</p>
    <p>My doctoral work connected probabilistic machine learning with hospital microbiology. Subsequent research at Universidad Politécnica de Madrid extended this approach to Parkinsonian speech, medical imaging and open biomedical datasets. At the University of Zurich, my MSCA project OUTBRAID addresses AI-driven outbreak detection using multimodal data.</p>
    <p>My experience combines interdisciplinary research, open science, university teaching, ongoing doctoral co-supervision and peer review in machine learning and biomedical journals. These activities support the critical assessment of research methodology, validation, reproducibility and clinical relevance.</p>
    {% assign short_accepted = peer_reviewed | where: "status", "accepted" | size %}
    {% assign short_published = peer_reviewed.size | minus: short_accepted %}
    <p><strong>Research record:</strong> {{ short_published }} published journal articles, {{ short_accepted }} accepted journal articles and {{ under_review.size }} preprints listed in the full CV. Google Scholar: {{ scholar_metrics.citations }} citations; h-index {{ scholar_metrics.h_index }} ({{ scholar_metrics.updated_on | date: "%d %B %Y" }}).</p>

    <p>The full teaching record also lists {{ thesis_msc }} MSc and {{ thesis_bsc }} BSc thesis supervision projects. Both ZHAW BSc projects were defended on 1 July 2026: MALDI-TOF/WGS data integration (5.5/6) and disc diffusion image analysis (4.5/6).</p>

    <p>Co-coordinator with Alejandro Lancho Serrano of UC3M teaching innovation project No. 25 (2024–2025), integrating neural networks and generative AI in a real data engineering competition.</p>
    <p>Peer review: Engineering Applications of Artificial Intelligence, Clinical Microbiology and Infection, IEEE Journal of Biomedical and Health Informatics, mSystems, and AISTATS.</p>
